# Po wypchnięciu tagu vX.Y.Z buduje pełny pakiet .deb (koła Pythona, modele FP32/INT8,
# ffmpeg) tym samym skryptem co lokalnie i publikuje wydanie z plikiem pakietu.
#   git tag v1.2.0 && git push origin v1.2.0
# Pierwsze budowanie trwa ~30 min (ffmpeg, eksport modeli); potem build/ jest w pamięci podręcznej.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Wersja z tagu musi zgadzać się z plikiem VERSION
        run: |
          test "v$(tr -d ' \n' < VERSION)" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME nie pasuje do VERSION ($(cat VERSION))"; exit 1; }

      - name: Sprawdzenie składni
        run: |
          python3 -m compileall -q src tools
          for f in uninstall.sh packaging/build-deb.sh ntfy/setup-ntfy.sh tools/build_ffmpeg.sh; do bash -n "$f"; done
          for f in packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm bin/szukaj-cpu bin/szukaj-cpu-export-tools; do sh -n "$f"; done

      - name: Pamięć podręczna (ffmpeg, modele, koła, narzędzia eksportu)
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg
            build/models
            build/wheels-*
            build/venv-export
            build/datasets
          key: build-${{ hashFiles('tools/build_ffmpeg.sh', 'tools/export_models.py', 'requirements.txt') }}
          restore-keys: build-

      - name: Budowa pakietu (kontener Debiana 13)
        run: bash packaging/build-deb.sh

      - name: Wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/*.deb --title "szukaj_cpu ${GITHUB_REF_NAME#v}" "${ARGS[@]}"
